<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Создание паттерна</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 2400 1600" preserveAspectRatio="xMidYMid slice">
        <defs>
            <pattern id="colored-grid" width="600" height="400" patternUnits="userSpaceOnUse" viewBox="0 0 600 400">
            
                <circle class="pattern-circle row-1" cx="50"  cy="50" r="30" fill="purple"></circle>
                <circle class="pattern-circle row-1" cx="150" cy="50" r="30" fill="white" stroke="yellow" stroke-width="5"></circle>
                <circle class="pattern-circle row-1" cx="250" cy="50" r="30" fill="lightblue"></circle>
                <circle class="pattern-circle row-1" cx="350" cy="50" r="30" fill="white" stroke="green" stroke-width="5"></circle>
                <circle class="pattern-circle row-1" cx="450" cy="50" r="30" fill="yellow"></circle>
                <circle class="pattern-circle row-1" cx="550" cy="50" r="30" fill="white" stroke="brown" stroke-width="5"></circle>

                <circle class="pattern-circle row-2" cx="50"  cy="150" r="30" fill="white" stroke="yellow" stroke-width="5"></circle>
                <circle class="pattern-circle row-2" cx="150" cy="150" r="30" fill="lightblue"></circle>
                <circle class="pattern-circle row-2" cx="250" cy="150" r="30" fill="white" stroke="green" stroke-width="5"></circle>
                <circle class="pattern-circle row-2" cx="350" cy="150" r="30" fill="yellow"></circle>
                <circle class="pattern-circle row-2" cx="450" cy="150" r="30" fill="white" stroke="brown" stroke-width="5"></circle>
                <circle class="pattern-circle row-2" cx="550" cy="150" r="30" fill="purple"></circle>

                <circle class="pattern-circle row-3" cx="50"  cy="250" r="30" fill="lightblue"></circle>
                <circle class="pattern-circle row-3" cx="150" cy="250" r="30" fill="white" stroke="green" stroke-width="5"></circle>
                <circle class="pattern-circle row-3" cx="250" cy="250" r="30" fill="yellow"></circle>
                <circle class="pattern-circle row-3" cx="350" cy="250" r="30" fill="white" stroke="brown" stroke-width="5"></circle>
                <circle class="pattern-circle row-3" cx="450" cy="250" r="30" fill="purple"></circle>
                <circle class="pattern-circle row-3" cx="550" cy="250" r="30" fill="white" stroke="brown" stroke-width="5"></circle>

                <circle class="pattern-circle row-4" cx="50"  cy="350" r="30" fill="white" stroke="brown" stroke-width="5"></circle>
                <circle class="pattern-circle row-4" cx="150" cy="350" r="30" fill="purple"></circle>
                <circle class="pattern-circle row-4" cx="250" cy="350" r="30" fill="white" stroke="yellow" stroke-width="5"></circle>
                <circle class="pattern-circle row-4" cx="350" cy="350" r="30" fill="lightblue"></circle>
                <circle class="pattern-circle row-4" cx="450" cy="350" r="30" fill="white" stroke="green" stroke-width="5"></circle>
                <circle class="pattern-circle row-4" cx="550" cy="350" r="30" fill="yellow"></circle>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#colored-grid)"></rect>
    </svg>
  </body>
